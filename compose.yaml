# Логи контейнеров: драйвер local (бинарный формат со сжатием старых файлов),
# не больше 5 файлов по 10 МБ на контейнер. Задано явно: на Linux по умолчанию
# json-file без ротации — лог растёт, пока не кончится диск.
x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: "5"

x-app: &app                     # общий кусок настроек (YAML-якорь)
  build: .
  image: tickets
  # Несекретные настройки окружения (VK_GROUP_ID, OWNER_VK_IDS, …); секретов
  # здесь нет — они в secrets: ниже. Файла может и не быть.
  env_file:
    - path: .env
      required: false
  environment:
    POSTGRES_HOST: postgres           # остальное (пользователь, база) — умолчания config.py
    REDIS_HOST: redis                 # имя сервиса = имя хоста во внутренней сети
    BACKUP_DIR: /backups              # jobs.backup; сам каталог смонтирован только в db-backup и cron
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped
  logging: *logging

services:
  # Разовый: дамп базы перед миграциями — только если migrate что-то накатит
  # (иначе пропускает). Упал — migrate и всё, что после, не стартует.
  db-backup:
    <<: *app
    command: python -m jobs.backup --reason pre-migrate
    restart: "no"
    secrets: [ postgres_password, vk_bot_token ]   # токен — для уведомления о сбое
    # Дампы — на хосте в ./backups; в web и bot не монтируем (персональные данные)
    volumes:
      - ./backups:/backups

  # Разовый: накатывает миграции и завершается; остальные ждут его успеха
  migrate:
    <<: *app
    command: alembic upgrade head
    restart: "no"
    secrets: [ postgres_password ]
    depends_on:
      postgres:
        condition: service_healthy
      db-backup:
        condition: service_completed_successfully

  web:
    <<: *app
    command: uvicorn web.app:app --host 0.0.0.0 --port 8000
    secrets: [ postgres_password, payments_password, cookie_secret ]
    # Ключ из якоря заменяется целиком (<< сливает только верхний уровень),
    # поэтому postgres повторяем
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports: [ "127.0.0.1:8000:8000" ]
    # curl в образе нет — проверяем Python из образа; HTTP 503 → исключение → код 1
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s    # первые 15 с неудачи не считаются: uvicorn ещё стартует

  bot:
    <<: *app
    command: python -m bot
    secrets: [ postgres_password, redis_password, vk_bot_token ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # PID 1 в контейнере — tini, а не python. SIGTERM бот обрабатывает сам,
    # но только после старта loop; до этого python как PID 1 сигнал бы
    # проигнорировал (ядро не доставляет PID 1 сигналы без обработчика).
    # tini также подбирает процессы-зомби.
    init: true
    # Портов нет: Long Poll — исходящие запросы к VK

  # Фоновые задачи по расписанию (jobs/crontab). supercronic — PID 1 сам:
  # пересылает сигналы задачам и подбирает зомби, поэтому без init: true.
  # -passthrough-logs: вывод задач в лог как есть, без обёртки supercronic.
  cron:
    <<: *app
    command: supercronic -passthrough-logs jobs/crontab
    secrets: [ postgres_password, vk_bot_token ]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backups:/backups

  postgres:
    image: postgres:18-alpine
    logging: *logging
    environment:
      POSTGRES_USER: tickets
      # Официальный образ читает пароль из файла. Применяется только при
      # создании пустого volume: у существующей базы пароль меняют ALTER USER
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: tickets
    secrets: [ postgres_password ]
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U tickets -d tickets" ]
      interval: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    logging: *logging
    # Конфиг — через stdin (redis-server -), а не аргументами: аргументы
    # процесса видны в ps и docker inspect. heredoc + exec: PID 1 становится
    # redis-server (с пайпом им остался бы sh, и docker stop ждал бы 10 с).
    # appendonly — журнал операций на диске: состояния FSM переживают рестарт.
    command:
      - sh
      - -c
      - |
        exec redis-server - <<CONF
        requirepass $$(cat /run/secrets/redis_password)
        appendonly yes
        CONF
    secrets: [ redis_password ]
    # Порт на хост не публикуем: бот ходит по внутренней сети Compose,
    # а на хосте 6379 занят локальным Redis для тестов
    volumes:
      - redisdata:/data
    healthcheck:
      # redis-cli берёт пароль из REDISCLI_AUTH
      test: [ "CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/secrets/redis_password) redis-cli ping | grep -q PONG" ]
      interval: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:

# Список секретов проекта. Файлы — в ./secrets/ (в .gitignore), по одному на
# секрет, без кавычек; в контейнере — /run/secrets/<имя>, config.py читает
# их по имени поля. Каждому сервису выдаются только нужные (secrets: выше).
secrets:
  postgres_password:
    file: ./secrets/postgres_password
  redis_password:
    file: ./secrets/redis_password
  vk_bot_token:
    file: ./secrets/vk_bot_token
  payments_password:
    file: ./secrets/payments_password
  cookie_secret:
    file: ./secrets/cookie_secret

x-app: &app                     # общий кусок настроек (YAML-якорь)
  build: .
  image: tickets
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://tickets:tickets@postgres:5432/tickets
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  web:
    <<: *app
    command: uvicorn web.app:app --host 0.0.0.0 --port 8000
    ports: [ "127.0.0.1:8000:8000" ]

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: tickets
      POSTGRES_PASSWORD: tickets
      POSTGRES_DB: tickets
    ports: [ "127.0.0.1:5432:5432" ]
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U tickets -d tickets" ]
      interval: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:

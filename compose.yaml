# Логи контейнеров: драйвер local (бинарный формат со сжатием старых файлов),
# не больше 5 файлов по 10 МБ на контейнер. Задано явно: на Linux по умолчанию
# json-file без ротации — лог растёт, пока не кончится диск.
x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: "5"

x-app: &app                     # общий кусок настроек (YAML-якорь)
  build: .
  image: tickets
  env_file: .env
  environment:
    POSTGRES_HOST: postgres           # остальное (пользователь, база) — умолчания config.py
    REDIS_HOST: redis                 # имя сервиса = имя хоста во внутренней сети
    BACKUP_DIR: /backups              # jobs.backup; сам каталог смонтирован только в db-backup и cron
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped
  logging: *logging

services:
  # Разовый: дамп базы перед миграциями — только если migrate что-то накатит
  # (иначе пропускает). Упал — migrate и всё, что после, не стартует.
  db-backup:
    <<: *app
    command: python -m jobs.backup --reason pre-migrate
    restart: "no"
    # Дампы — на хосте в ./backups; в web и bot не монтируем (персональные данные)
    volumes:
      - ./backups:/backups

  # Разовый: накатывает миграции и завершается; остальные ждут его успеха
  migrate:
    <<: *app
    command: alembic upgrade head
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      db-backup:
        condition: service_completed_successfully

  web:
    <<: *app
    command: uvicorn web.app:app --host 0.0.0.0 --port 8000
    # Ключ из якоря заменяется целиком (<< сливает только верхний уровень),
    # поэтому postgres повторяем
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports: [ "127.0.0.1:8000:8000" ]
    # curl в образе нет — проверяем Python из образа; HTTP 503 → исключение → код 1
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s    # первые 15 с неудачи не считаются: uvicorn ещё стартует

  bot:
    <<: *app
    command: python -m bot
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # PID 1 в контейнере — tini, а не python. SIGTERM бот обрабатывает сам,
    # но только после старта loop; до этого python как PID 1 сигнал бы
    # проигнорировал (ядро не доставляет PID 1 сигналы без обработчика).
    # tini также подбирает процессы-зомби.
    init: true
    # Портов нет: Long Poll — исходящие запросы к VK

  # Фоновые задачи по расписанию (jobs/crontab). supercronic — PID 1 сам:
  # пересылает сигналы задачам и подбирает зомби, поэтому без init: true.
  # -passthrough-logs: вывод задач в лог как есть, без обёртки supercronic.
  cron:
    <<: *app
    command: supercronic -passthrough-logs jobs/crontab
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backups:/backups

  postgres:
    image: postgres:18-alpine
    logging: *logging
    environment:
      POSTGRES_USER: tickets
      POSTGRES_PASSWORD: tickets
      POSTGRES_DB: tickets
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U tickets -d tickets" ]
      interval: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    logging: *logging
    # Пароль подставляет Compose из .env при запуске (интерполяция ${...});
    # :? — не стартовать вовсе, если переменная пустая.
    # appendonly — журнал операций на диске: состояния FSM переживают рестарт.
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --appendonly yes
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}  # redis-cli берёт пароль отсюда (для healthcheck)
    # Порт на хост не публикуем: бот ходит по внутренней сети Compose,
    # а на хосте 6379 занят локальным Redis для тестов
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:

[project]
name = "tickets"
version = "0.1.0"
description = "Concert ticket management: VK bot + web UI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.9",
    "fastapi>=0.115.0",
    "itsdangerous>=2.1.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
    # IANA time zones for zoneinfo (slim images have no system tz database)
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.30.0",
    "vkbottle>=4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23",
]

[tool.uv]
# Пока проект — набор модулей в корне, не устанавливаемый пакет.
# Пакет `tickets` появится на этапе 7 ROADMAP (тогда — package = true).
package = false

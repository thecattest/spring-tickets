[project]
name = "tickets"
version = "0.1.0"
description = "Concert ticket management: VK bot + web UI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.9",
    "alembic>=1.20.1",
    "fastapi>=0.115.0",
    "itsdangerous>=2.1.0",
    "jinja2>=3.1.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
    # IANA time zones for zoneinfo (slim images have no system tz database)
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.30.0",
    "vkbottle>=4.11",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.17.5",
    "testcontainers[postgres,redis]>=4.8",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.uv]
# Проект — устанавливаемый пакет tickets: uv sync ставит его в .venv
# (editable), импорты `from tickets…` работают из любого каталога
package = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["data", "backups"]

[tool.ruff.lint]
# Умеренный набор: ошибки, импорты, устаревший синтаксис, частые баги, упрощения
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",  # длину строк держит форматтер; длинные строки текста не ломаем
    "B008",  # вызовы в аргументах по умолчанию — штатный паттерн FastAPI (Form(...))
    "E712",  # `column == True` — штатный способ сравнения в SQLAlchemy-запросах
    "UP042", # (str, Enum) → StrEnum меняет str(): код сравнивает str(BotState...) — этап 7
]

[tool.ruff.lint.per-file-ignores]
# raise без from в старом слое БД — переписывается в сервисы на этапе 7
"src/tickets/bot/utils/db.py" = ["B904"]

[tool.ruff.lint.isort]
known-first-party = ["tickets", "migrations", "scripts", "tests"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"


[tool.alembic]
# Конфиг Alembic целиком здесь, alembic.ini нет: URL берётся из database.py,
# логирование — из logging_config.py (см. migrations/env.py).
script_location = "%(here)s/migrations"
# 20261114_1530-<rev>_<slug>.py — файлы сортируются по времени создания
file_template = "%%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s"
timezone = "UTC"
prepend_sys_path = ["."]

[[tool.alembic.post_write_hooks]]
name = "ruff_fix"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"

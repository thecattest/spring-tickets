# Проверки перед каждым коммитом. Установка (один раз): uv run pre-commit install
# Вручную по всему проекту: uv run pre-commit run --all-files
#
# Хуки локальные: вызывают инструменты через `uv run`, то есть ровно те версии,
# что зафиксированы в uv.lock (без отдельных версий в этом файле).
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      # Весь пакет (настройки — [tool.mypy] в pyproject.toml): изменение типа
      # в одном модуле может сломать другие, поэтому без списка файлов
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false

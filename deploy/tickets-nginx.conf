# Не больше 5 попыток входа на /payments в минуту с одного IP
# (limit_req_zone объявляется на уровне http — этот файл подключается внутри http {})
limit_req_zone $binary_remote_addr zone=payments_login:10m rate=5r/m;

server {
    listen 80;
    server_name xn----7sbendrvcb5df1a1g.xn--p1ai;

    location = /payments/login {
        limit_req zone=payments_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;  # web в Compose
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;  # web в Compose
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

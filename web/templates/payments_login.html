<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — Платежи</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #1a1a2e;
    color: #eee;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .login-card {
    background: #16213e;
    border-radius: 16px;
    padding: 40px 32px;
    width: 100%;
    max-width: 380px;
  }
  .login-card h1 {
    font-size: 1.4rem;
    margin-bottom: 24px;
    text-align: center;
  }
  .login-card input[type="password"] {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid #555;
    border-radius: 5px;
    background: #1a1a2e;
    color: #eee;
    font-size: 1rem;
    outline: none;
    margin-bottom: 16px;
  }
  .login-card input[type="password"]:focus {
    border-color: #e94560;
  }
  .login-card button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 5px;
    background: linear-gradient(135deg, #e94560, #c23152);
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.05em;
  }
  .login-card button:hover {
    opacity: 0.9;
  }
  .error {
    color: #E53935;
    font-size: 0.9rem;
    margin-bottom: 12px;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="login-card">
    <h1>Платежи</h1>
    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
    <form method="post" action="/payments/login">
      <input type="password" name="password" placeholder="Пароль" autofocus required>
      <button type="submit">Войти</button>
    </form>
  </div>
</body>
</html>
